<html lang="ko">
<head>
<meta charset="utf-8">
<title>4개 환경 그룹</title>
<style>
  :root {
    --bg: #f1f1f1;
    --card: #ffffff;
    --ink: #111111;
    --ink-2: #4a4a48;
    --ink-3: #8a8984;
    --hair: #e6e5e0;
    --c1: #2a78d6;  /* 1군집 높은 고도·높은 LS  */
    --c2: #16a374;  /* 2군집 미정리 밭·낮은 LS  */
    --c3: #eb6834;  /* 3군집 낮은 고도·높은 LS  */
    --c4: #b0479b;  /* 4군집 정리된 밭·낮은 LS  */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    width: 1920px; height: 1080px; overflow: hidden; position: relative;
    font-family: "Pretendard", system-ui, sans-serif; color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .meta { position: absolute; top: 40px; left: 64px; right: 64px; display: flex; justify-content: space-between;
          font-size: 21px; font-weight: 500; color: var(--ink-2); }
  .head { position: absolute; top: 84px; left: 0; right: 0; text-align: center; }
  .kicker { font-size: 27px; font-weight: 500; color: var(--ink-3); }
  .title  { margin-top: 8px; font-size: 52px; font-weight: 800; letter-spacing: -1.2px; }

  .card { position: absolute; top: 222px; height: 800px; background: var(--card); border-radius: 22px;
          box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 28px rgba(0,0,0,.06); }

  /* ---------- scatter ---------- */
  #plot { left: 56px; width: 1136px; }
  #plot svg { position: absolute; inset: 0; }
  .chip { position: absolute; display: flex; align-items: center; gap: 12px;
          background: #fff; border: 2px solid var(--c); border-radius: 14px; padding: 10px 18px 10px 14px;
          box-shadow: 0 4px 14px rgba(0,0,0,.10); white-space: nowrap; }
  #plot .chip svg { position: static; width: 26px; height: 26px; flex: none; }
  .chip .nm { font-size: 23px; font-weight: 800; letter-spacing: -0.4px; }
  .chip .sub { margin-top: 2px; font-size: 18px; font-weight: 600; color: var(--ink-3); }
  .chip .sub b { color: var(--ink); font-weight: 800; }
  .cap { position: absolute; left: 32px; bottom: 24px; font-size: 18px; font-weight: 500; color: var(--ink-3); }
  .cap b { color: var(--ink-2); font-weight: 700; }

  /* ---------- table ---------- */
  #table { left: 1216px; width: 648px; padding: 30px 36px 28px; display: flex; flex-direction: column; }
  #rows { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; margin-bottom: 18px; }
  #rows .row:last-child { border-bottom: 0; }
  .th { display: flex; justify-content: space-between; font-size: 18px; font-weight: 600; color: var(--ink-3);
        padding-bottom: 14px; border-bottom: 2px solid var(--hair); }
  .row { padding: 22px 0 20px; border-bottom: 1px solid var(--hair); }
  .row .top { display: flex; align-items: center; gap: 16px; }
  .row .ico { width: 34px; height: 34px; flex: none; }
  .row .nm  { font-size: 28px; font-weight: 800; letter-spacing: -0.6px; }
  .row .ds  { margin-top: 3px; font-size: 18px; font-weight: 500; color: var(--ink-3); }
  .row .num { margin-left: auto; text-align: right; }
  .row .cnt { font-size: 31px; font-weight: 800; letter-spacing: -0.6px; }
  .row .cnt small { font-size: 20px; font-weight: 600; margin-left: 2px; }
  .row .pct { font-size: 19px; font-weight: 600; color: var(--ink-2); }
  .bar { margin: 14px 0 0 50px; height: 10px; border-radius: 5px; background: #efeee9; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 5px; background: var(--c); }
  .row.big .bar { height: 10px; }
  .take { background: #f5f5f2; border-radius: 14px; padding: 18px 22px;
          font-size: 21px; font-weight: 600; color: var(--ink-2); line-height: 1.45; letter-spacing: -0.2px; }
  .take b { color: var(--ink); font-weight: 800; }

  body.chart-only, body.chart-only html { background: transparent; }
  body.chart-only .meta, body.chart-only .head { display: none; }
</style>
</head>

// ---------- scatter ----------
const S = 2.0, CX = 548, CY = 392, OX = 228, OY = 265;      // orig-image coords -> card coords
const X = x => CX + (x - OX) * S, Y = y => CY + (y - OY) * S;
const ns = 'http://www.w3.org/2000/svg';
const sv = document.getElementById('sv');
let defs = `<defs>

let halo = '', dots = '';
for (const k of [2, 4, 1, 3]) {
  const pts = DATA.pts[k];
  halo += `<g filter="url(#glow)" opacity=".16">` + pts.filter((_, i) => i % 2 === 0)
            .map(([x, y]) => `<circle cx="${X(x).toFixed(1)}" cy="${Y(y).toFixed(1)}" r="9" fill="${G[k].hex}"/>`).join('') + `</g>`;
  dots += `<g fill="${G[k].hex}" fill-opacity=".62">` + pts
            .map(([x, y]) => `<circle cx="${X(x).toFixed(1)}" cy="${Y(y).toFixed(1)}" r="2.9"/>`).join('') + `</g>`;
}
// chips: [left, top] in card coords
const CHIP = {"1": [96, 178], "2": [56, 604], "3": [820, 650], "4": [804, 176]};
const plot = document.getElementById('plot');

  const d = document.createElement('div');
  d.className = 'chip'; d.id = 'chip' + k; d.style.setProperty('--c', G[k].hex);
  d.style.left = CHIP[k][0] + 'px'; d.style.top = CHIP[k][1] + 'px';
  d.innerHTML = icon(k, 26) + `<div><div class="nm">${G[k].nm}</div><div class="sub">${k}군집 · <b>${G[k].p.toFixed(1)}%</b></div></div>`;
  plot.appendChild(d);
}
let leaders = '', marks = '';
for (const k of [1, 2, 3, 4]) {
  const [mx, my] = DATA.markers[k];
  const px = X(mx), py = Y(my);
  const el = document.getElementById('chip' + k);
  const L = el.offsetLeft, T = el.offsetTop, R = L + el.offsetWidth, B = T + el.offsetHeight;

  leaders += `<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#fff" stroke-width="7" stroke-linecap="round"/>`

}
sv.innerHTML = defs + halo + dots + leaders + marks;

// ---------- table ----------
const rows = document.getElementById('rows');

  rows.insertAdjacentHTML('beforeend', `

    </div>`);
