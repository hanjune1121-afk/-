    <g fill="none" stroke="#fff" stroke-width="7"><rect x="-370" y="-420" width="740" height="840" rx="6"/><line x1="-370" y1="0" x2="370" y2="0"/><circle r="110"/><rect x="-150" y="-420" width="300" height="130"/><rect x="-150" y="290" width="300" height="130"/></g>
